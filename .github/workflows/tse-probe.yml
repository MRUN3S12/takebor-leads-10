name: TSE probe
on:
  push:
    branches: [claude/tse-results-live-analyzer-2k3ml2]
    paths: [.github/workflows/tse-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          curl -s --retry 5 --retry-all-errors -A "Mozilla/5.0" -o sp7.json https://resultados.tse.jus.br/oficial/ele2026/6259/dados/sp/sp-c0007-e006259-u.json
          python3 - <<'PY'
          import json
          d=json.load(open('sp7.json'))
          print('SP dep estadual', d['dt'], d['ht'], 'secoes', d['s']['pst'], 'md', d.get('md'), 'tf', d.get('tf'))
          psd=[]
          for a in d['carg'][0]['agr']:
              for p in a['par']:
                  for c in p.get('cand',[]):
                      if 'RITA' in c['nm'].upper() and 'PASSOS' in c['nm'].upper():
                          print('CAND', c['nmu'], '|', c['nm'], '|', p['sg'], '| votos', c['vap'], c['pvap'], '| e', c['e'], '| st', repr(c['st']), '|', c['dvt'])
                      if p['sg']=='PSD': psd.append((int(c['vap']), c['nmu'], c['e'], c['st']))
          psd.sort(reverse=True)
          print('PSD eleitos', sum(1 for x in psd if x[2]=='s'))
          for i,x in enumerate(psd[:14]): print(' ', i+1, x)
          PY
