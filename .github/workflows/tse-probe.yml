name: TSE probe
on:
  push:
    branches: [claude/tse-results-live-analyzer-2k3ml2]
    paths: [.github/workflows/tse-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          B=https://resultados.tse.jus.br/oficial
          curl -sSI --retry 5 --retry-all-errors -A "Mozilla/5.0" -H "Origin: https://mrun3s12.github.io" $B/ele2026/6257/dados/br/br-c0001-e006257-u.json | grep -i -E "access-control|cache|content-type" || true
          curl -sS --retry 5 --retry-all-errors -A "Mozilla/5.0" $B/ele2026/6257/dados/br/br-c0001-e006257-u.json -o u.json
          python3 - <<'PY'
          import json
          d=json.load(open('u.json'))
          print(json.dumps(d, ensure_ascii=False, separators=(',',':'))[:20000])
          PY
