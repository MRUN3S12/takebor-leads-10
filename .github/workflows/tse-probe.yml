name: TSE probe
on:
  push:
    branches: [claude/tse-results-live-analyzer-2k3ml2]
    paths: [.github/workflows/tse-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          B=https://resultados.tse.jus.br/oficial/ele2026/6257/dados
          for uf in br ac al ap am ba ce df es go ma mt ms mg pa pb pr pe pi rj rn rs ro rr sc sp se to zz; do
            curl -s --retry 5 --retry-all-errors -A "Mozilla/5.0" -o $uf.json $B/$uf/$uf-c0001-e006257-u.json &
          done; wait
          python3 - <<'PY'
          import json
          def load(uf):
              d=json.load(open(uf+'.json'))
              v={}
              for a in d['carg'][0]['agr']:
                  for p in a['par']:
                      for c in p['cand']:
                          if c['dvt'].lower().startswith('v'): v[c['nmu']]=int(c['vap'])
              return d,v
          d,v=load('br'); vv=sum(v.values())
          F,L='FLAVIO BOLSONARO','LULA'
          print(f"BR {d['ht']} secoes {d['s']['pst']}% eleitores nao apurados {d['e']['esnt']} | F {v[F]} ({100*v[F]/vv:.3f}%) L {v[L]} ({100*v[L]/vv:.3f}%) validos {vv} md={d['md']}")
          ufs='ac al ap am ba ce df es go ma mt ms mg pa pb pr pe pi rj rn rs ro rr sc sp se to zz'.split()
          tot={}; Fv=Lv=VV=0; ENA=0; projF=projV=0; maxF=0; lines=[]
          for uf in ufs:
              d,v=load(uf); e=d['e']; vu=sum(v.values())
              est=int(e['est']); esnt=int(e['esnt']); c=int(e['c'])
              comp = c/est if est else 0.8; val = vu/c if c else 0.95
              rest = esnt*comp*val
              sF = v.get(F,0)/vu if vu else 0.45
              Fv+=v.get(F,0); Lv+=v.get(L,0); VV+=vu; ENA+=esnt
              projF += v.get(F,0)+rest*sF; projV += vu+rest
              lines.append((esnt, uf, d['s']['pst'], sF, rest))
          print(f"SOMA UFs: F {Fv} ({100*Fv/VV:.3f}%) L {Lv} validos {VV} eleitores nao apurados {ENA}")
          print(f"PROJECAO por UF (restante dividido como cada UF ja votou): F final {100*projF/projV:.3f}%  validos finais ~{projV:.0f}")
          print(f"MATEMATICA: F precisa de >{(projV/2):.0f} votos; tem {Fv}. Se TODOS os {ENA} eleitores restantes votassem F: {100*(Fv+ENA)/(VV+ENA):.2f}%. Se nenhum: {100*Fv/(VV+ENA):.2f}%")
          need = (VV+ENA*0.8*0.95)/2 - Fv
          print(f"F precisa de ~{100*need/(ENA*0.8*0.95):.1f}% dos votos validos restantes estimados para passar de 50%")
          lock = VV - 2*Fv
          print(f"TRAVA 2T: VV-2F = {lock}; eleitores restantes {ENA} -> {'2o TURNO MATEMATICAMENTE GARANTIDO' if ENA <= lock else 'ainda nao travado'}")
          print(f"1o LUGAR: F-L = {Fv-Lv}; restantes {ENA} -> {'travado' if Fv-Lv > ENA else 'nao travado'}")
          for esnt,uf,pst,sF,rest in sorted(lines, reverse=True)[:8]:
              print(f"  {uf.upper()} secoes {pst}% faltam {esnt} eleitores, F {100*sF:.1f}%, ~{rest:.0f} validos restantes")
          PY
