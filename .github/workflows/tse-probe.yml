name: TSE probe
on:
  push:
    branches: [claude/tse-results-live-analyzer-2k3ml2]
    paths: [.github/workflows/tse-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          B=https://resultados.tse.jus.br/oficial/ele2026/6257/dados
          for uf in sp ba df zz ac; do
            code=$(curl -s --retry 5 --retry-all-errors -A "Mozilla/5.0" -o $uf.json -w '%{http_code}' -H "Origin: https://mrun3s12.github.io" -D h_$uf.txt $B/$uf/$uf-c0001-e006257-u.json)
            echo "== $uf $code $(wc -c < $uf.json) bytes"; grep -i "access-control" h_$uf.txt || echo "(sem ACAO)"
          done
          python3 - <<'PY'
          import json
          d=json.load(open('sp.json'))
          print({k:d[k] for k in d if k!='carg'})
          c=[x for a in d['carg'][0]['agr'] for p in a['par'] for x in p['cand']]
          print(sorted([(x['nmu'],x['vap']) for x in c], key=lambda t:-int(t[1]))[:3])
          PY
